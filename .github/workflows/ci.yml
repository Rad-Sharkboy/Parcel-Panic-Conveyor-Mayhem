name: Windows build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows MinGW tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: Add MinGW tools to the Windows PATH
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Build the game
        shell: cmd
        run: build.bat
      - name: Package the game and fonts
        shell: pwsh
        run: |
          $package = "dist/ParcelPanic"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "build/ParcelPanic.exe" $package
          Copy-Item "build/assets" $package -Recurse
          Copy-Item "docs/PLAY.txt" "$package/Read me.txt"
          Compress-Archive -Path $package -DestinationPath "dist/ParcelPanic-Windows-x64.zip"
      - name: Save the Windows download
        uses: actions/upload-artifact@v4
        with:
          name: ParcelPanic-Windows-x64
          path: dist/ParcelPanic-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ParcelPanic-Windows-x64
          path: dist
      - name: Publish the Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          # v1.0.0 is displayed as V1; other versions keep their full version number.
          $version = $env:RELEASE_TAG -replace '^v', '' -replace '\.0\.0$', ''
          $title = "Parcel Panic: Conveyor Mayhem V$version"
          if ($env:RELEASE_TAG -like '*-dev.*') {
            gh release create "$env:RELEASE_TAG" dist/ParcelPanic-Windows-x64.zip --verify-tag --prerelease --title "$title" --notes-file .github/RELEASE_NOTES.md
          } else {
            gh release create "$env:RELEASE_TAG" dist/ParcelPanic-Windows-x64.zip --verify-tag --latest --title "$title" --notes-file .github/RELEASE_NOTES.md
          }
